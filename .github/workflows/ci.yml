name: CI

# Pull-request validation. The Windows portable release pipeline lives in
# deploy.yml; this workflow is the pre-merge gate (quality, frontend, native
# Windows and native Linux) plus the two workflow-security gates (lockfile and
# zizmor). All six job names are required status checks on main, so keep them
# stable.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: npm run check:version

      - name: Validate local assets
        run: npm run check:local-assets

      - name: Scan for secrets
        run: npm run check:secrets

      - name: Check skill references
        run: npm run check:skill-references

      - name: Check third-party licenses
        run: python scripts/check_third_party_licenses.py

      - name: Type-check
        run: npx tsc --noEmit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Build Studio
        run: npm run build

  native-windows:
    name: native-windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      # Builds the native C++20 targets with MSVC hardening and runs CTest.
      # No frontend is built here; the frontend job covers TypeScript/Vite.
      - name: Build and test native backend
        run: python CppCore/dev.py --test --no-frontend

  # Optional guard for the release-only ONNX/DirectML path (not a required
  # check). The release pipeline itself builds with the same flags; this keeps
  # that path from rotting between releases.
  native-windows-onnx:
    name: native-windows-onnx
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Cache ONNX Runtime + DirectML
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/arestrix-deps/onnxruntime-directml
          key: onnxruntime-directml-ort1.24.4-dml1.15.4

      - name: Fetch ONNX Runtime + DirectML
        shell: bash
        run: |
          python scripts/fetch_onnxruntime.py --output "$RUNNER_TEMP/arestrix-deps/onnxruntime-directml"
          echo "ONNXRUNTIME_ROOT=$RUNNER_TEMP/arestrix-deps/onnxruntime-directml" >> "$GITHUB_ENV"

      - name: Build and test native backend with ONNX + DirectML
        run: python CppCore/dev.py --test --no-frontend --onnx-dml

  native-linux:
    name: native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      # Same C++20 build and CTest suite as Windows, using GCC/Clang on Linux.
      - name: Build and test native backend
        run: python CppCore/dev.py --test --no-frontend

  # Fails when .github/workflows/actions.lock is out of sync with the workflows,
  # or when a locked pin no longer verifies upstream. Required on main: the
  # check is read-only and fail-closed, so a stale lockfile must stop the merge
  # rather than reach a release. It talks to the GitHub API, so if upstream is
  # having an outage the owner bypass in AUTOMATION.md is the escape hatch.
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # The action pins themselves are only trustworthy if the tool that checks
      # them is pinned too, hence --pin. Bump it by hand (see AUTOMATION.md).
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        run: gh actions-lock --verify

  # Static audit of the workflow definitions themselves: excessive permissions,
  # token persistence, template injection, cache/artifact poisoning. This is the
  # complement of `lockfile`, which only proves the action code is the code that
  # was reviewed, not that the workflow handles tokens and PR code safely.
  # Required on main, alongside `lockfile`; see .github/AUTOMATION.md.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned by hand, like the gh-actions-lock pin above: the linter is part of
      # the gate, so it cannot itself float. v1.32.0 is the first release that
      # understands actions.lock; older ones demand SHA pins instead.
      - name: Install zizmor
        run: pipx install zizmor==1.32.0

      # Informational findings stay advisory (they are shown locally by
      # `npm run check:workflows`); low and above fail the job.
      - name: Audit workflows
        run: zizmor --min-severity=low --format=github .github/workflows
