name: CI

# Pull-request validation. The Windows portable release pipeline lives in
# deploy.yml; this workflow is the pre-merge gate (quality, frontend, native
# Windows and native Linux). The four job names are required status checks on
# main, so keep them stable.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: npm run check:version

      - name: Validate local assets
        run: npm run check:local-assets

      - name: Scan for secrets
        run: npm run check:secrets

      - name: Check skill references
        run: npm run check:skill-references

      - name: Check third-party licenses
        run: python scripts/check_third_party_licenses.py

      - name: Type-check
        run: npx tsc --noEmit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Build Studio
        run: npm run build

  native-windows:
    name: native-windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Builds the native C++20 targets with MSVC hardening and runs CTest.
      # No frontend is built here; the frontend job covers TypeScript/Vite.
      - name: Build and test native backend
        run: python CppCore/dev.py --test --no-frontend

  # Optional guard for the release-only ONNX/DirectML path (not a required
  # check). The release pipeline itself builds with the same flags; this keeps
  # that path from rotting between releases.
  native-windows-onnx:
    name: native-windows-onnx
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache ONNX Runtime + DirectML
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arestrix-deps/onnxruntime-directml
          key: onnxruntime-directml-ort1.24.4-dml1.15.4

      - name: Fetch ONNX Runtime + DirectML
        shell: bash
        run: |
          python scripts/fetch_onnxruntime.py --output "$RUNNER_TEMP/arestrix-deps/onnxruntime-directml"
          echo "ONNXRUNTIME_ROOT=$RUNNER_TEMP/arestrix-deps/onnxruntime-directml" >> "$GITHUB_ENV"

      - name: Build and test native backend with ONNX + DirectML
        run: python CppCore/dev.py --test --no-frontend --onnx-dml

  native-linux:
    name: native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Same C++20 build and CTest suite as Windows, using GCC/Clang on Linux.
      - name: Build and test native backend
        run: python CppCore/dev.py --test --no-frontend

  # ---------------------------------------------------------------------------
  # Static & Dynamic C++ Security Analyzers (Clang-Tidy, Cppcheck, ASan, UBSan, TSan)
  # ---------------------------------------------------------------------------
  cpp-static-analysis:
    name: cpp-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM Clang-Tidy & Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cppcheck cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Cppcheck static analysis
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --suppress="*:*third_party/*" \
                   -I CppCore/src \
                   CppCore/src

      - name: Generate compilation database & run Clang-Tidy security/concurrency checks
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DARESTRIX_BUILD_STUDIO=OFF \
            -DARESTRIX_BUILD_TESTS=ON
          run-clang-tidy -p build-tidy -config-file=.clang-tidy \
            -warnings-as-errors="clang-analyzer-*,concurrency-*,bugprone-use-after-move,bugprone-dangling-handle,bugprone-string-constructor,cert-err34-c,cert-env33-c,cert-msc50-cpp,cert-msc51-cpp,cppcoreguidelines-slicing" \
            -quiet "CppCore/src/.*"

  cpp-asan-ubsan:
    name: cpp-asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Clang and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and run CTest with AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          python CppCore/dev.py --test --no-frontend --sanitizers --build-dir build-asan

  cpp-tsan:
    name: cpp-tsan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Clang and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and run CTest with ThreadSanitizer (Taskflow DAG concurrency)
        env:
          CC: clang
          CXX: clang++
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          python CppCore/dev.py --test --no-frontend --tsan --build-dir build-tsan
