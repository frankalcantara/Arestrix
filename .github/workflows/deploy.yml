name: Deploy portable build

# Builds the real Arestrix binary (native C++ + Studio UI), runs the quality
# gate and publishes a ready-to-run Windows x64 portable package.
#
# - push to main  -> updates the rolling `latest` pre-release
# - tag v*        -> publishes/updates the release for that tag
# - manual run    -> same rules, based on the selected branch/tag

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 package + Inno installer
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ONNX Runtime DirectML + DirectML.dll are not vendored. The packages are
      # pinned by version and SHA-256 in scripts/fetch_onnxruntime.py; the cache
      # keeps the ~36 MB extracted runtime between runs.
      - name: Cache ONNX Runtime + DirectML
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arestrix-deps/onnxruntime-directml
          key: onnxruntime-directml-ort1.24.4-dml1.15.4

      - name: Fetch ONNX Runtime + DirectML
        shell: bash
        run: |
          python scripts/fetch_onnxruntime.py --output "$RUNNER_TEMP/arestrix-deps/onnxruntime-directml"
          echo "ONNXRUNTIME_ROOT=$RUNNER_TEMP/arestrix-deps/onnxruntime-directml" >> "$GITHUB_ENV"

      # Canonical gate: frontend build, native C++20 build (MSVC, hardening),
      # CTest, Vitest, version/assets/secrets/licenses checks, gateway smoke,
      # then release-manifest + SHA256SUMS + SBOM.
      - name: Run release gate
        run: python scripts/release_check.py --skip-e2e --onnx-dml

      - name: Read product version
        id: product
        shell: bash
        run: |
          version=$(cat version.txt)
          numeric=$(echo "$version" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3.0/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      # Optional SignPath Foundation signing. Set the repository variable
      # SIGNPATH_ENABLED=true and configure the vars/secrets documented in
      # signpath/README.md. Without it, the unsigned release flow remains.
      - name: Verify Windows metadata for SignPath
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = '${{ steps.product.outputs.version }}'
          foreach ($name in @('arestrix.exe','arestrix-cli.exe','arestrix-gateway.exe','arestrix-memory.exe')) {
            $v = (Get-Item (Join-Path 'build' $name)).VersionInfo
            if ($v.ProductName -ne 'Arestrix' -or $v.CompanyName -ne 'Arestrix' -or $v.ProductVersion -ne $expected -or $v.FileVersion -ne $expected) {
              throw "$name metadata mismatch: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion) CompanyName=$($v.CompanyName)"
            }
          }

      - name: Package unsigned binaries
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $binaries = @('arestrix.exe','arestrix-cli.exe','arestrix-gateway.exe','arestrix-memory.exe')
          foreach ($name in $binaries) {
            if (-not (Test-Path (Join-Path 'build' $name))) { throw "missing build/$name" }
          }
          Compress-Archive -Path ($binaries | ForEach-Object { Join-Path 'build' $_ }) `
            -DestinationPath unsigned-binaries.zip -Force

      - name: Upload unsigned binaries
        id: upload_unsigned_binaries
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: arestrix-unsigned-binaries
          path: unsigned-binaries.zip
          archive: false
          if-no-files-found: error

      - name: Sign binaries with SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_binaries.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-binaries
          parameters: |
            version: "${{ steps.product.outputs.version }}"

      - name: Install signed binaries
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $requireTrusted = '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}' -ne 'test-signing'
          $signed = @(Get-ChildItem signed-binaries -Filter *.exe -Recurse)
          if ($signed.Count -lt 4) { throw "expected 4 signed binaries, found $($signed.Count)" }
          foreach ($file in $signed) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if (-not $sig.SignerCertificate) { throw "$($file.Name): no Authenticode signer" }
            if ($requireTrusted -and $sig.Status -ne 'Valid') { throw "$($file.Name): signature status $($sig.Status)" }
            Write-Host "$($file.Name): $($sig.Status) / $($sig.SignerCertificate.Subject)"
            Copy-Item $file.FullName (Join-Path 'build' $file.Name) -Force
          }

      - name: Refresh release manifest after signing
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_manifest.py

      # Stages the portable folder, runs the CLI smoke tests, writes the
      # ZIP + SHA-256 sidecar and compiles the Inno Setup installer from the
      # same staging tree. Requires release/SBOM.json from the gate.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable package and installer
        run: python scripts/package_release.py --installer --require-onnx --require-directml

      - name: Upload unsigned installer
        id: upload_unsigned_installer
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: arestrix-unsigned-installer
          path: release/*-setup.exe
          archive: false
          if-no-files-found: error

      - name: Sign installer with SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-installer
          parameters: |
            versionNumeric: "${{ steps.product.outputs.numeric }}"

      - name: Install signed installer
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $requireTrusted = '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}' -ne 'test-signing'
          $setup = Get-ChildItem signed-installer -Filter *-setup.exe -Recurse | Select-Object -First 1
          if (-not $setup) { throw "signed installer not found" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          if (-not $sig.SignerCertificate) { throw "$($setup.Name): no Authenticode signer" }
          if ($requireTrusted -and $sig.Status -ne 'Valid') { throw "$($setup.Name): signature status $($sig.Status)" }
          Write-Host "$($setup.Name): $($sig.Status) / $($sig.SignerCertificate.Subject)"
          Copy-Item $setup.FullName (Join-Path 'release' $setup.Name) -Force
          $hash = (Get-FileHash (Join-Path 'release' $setup.Name) -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Path (Join-Path 'release' "$($setup.Name).sha256") -Encoding ascii

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          $dir = Join-Path $env:RUNNER_TEMP "ArestrixInstallerSmoke"
          $log = Join-Path $env:RUNNER_TEMP "arestrix-installer-smoke.log"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "installer exited with $($install.ExitCode)"
          }
          $logText = Get-Content $log -Raw
          if ($logText -notmatch 'Preflight report') { throw "preflight report missing from setup log" }
          if ($logText -notmatch '\[OK\] Microsoft Edge WebView2 Runtime') { throw "WebView2 check failed" }
          if ($logText -notmatch '\[OK\] Microsoft Visual C\+\+ Redistributable x64') { throw "VC++ check failed" }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Arestrix.lnk'
          if (-not (Test-Path $desktopShortcut)) { throw "desktop shortcut was not created" }
          & (Join-Path $dir 'arestrix-cli.exe') version
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          foreach ($dll in @('onnxruntime.dll','onnxruntime_providers_shared.dll','DirectML.dll')) {
            if (-not (Test-Path (Join-Path $dir $dll))) { throw "installed ONNX runtime missing $dll" }
          }
          $status = & (Join-Path $dir 'arestrix-cli.exe') compress --status --json | ConvertFrom-Json
          if (-not $status.onnx) { throw "installed CLI was built without ONNX" }
          if (-not $status.dmlBuild) { throw "installed CLI was built without DirectML" }
          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') `
            -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Milliseconds 500
          if (Test-Path $dir) { throw "install directory was not removed" }
          if (Test-Path $desktopShortcut) { throw "desktop shortcut was not removed" }

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Arestrix ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Arestrix latest build (Windows x64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Ready-to-run **Windows x64** build of Arestrix
            `${{ steps.product.outputs.version }}` (commit `${{ github.sha }}`).

            ## Run the Studio

            **Installer (recommended):** download
            `arestrix-${{ steps.product.outputs.version }}-windows-x64-setup.exe`, run it, and
            open Arestrix from the Start menu. It installs per user in
            `%LOCALAPPDATA%\Programs\Arestrix` and requires no administrator rights.

            **Portable:** download `arestrix-${{ steps.product.outputs.version }}-windows-x64.zip`,
            extract it to any folder (that folder becomes `ARESTRIX_HOME`) and run
            `start-arestrix.bat`.

            The CLI is installed with the Studio:

            ```bat
            arestrix-cli.exe version
            arestrix-cli.exe project validate --project examples\01-svg-agente
            ```

            ## Requirements

            - Windows 10/11 x64.
            - Microsoft Edge WebView2 Runtime and the Visual C++ Redistributable.
              The installer detects both and offers the official download links when missing.
            - The installer also reports (without exposing values) whether Git, a GitHub credential,
              MSVC Build Tools and provider API keys are configured; missing optional items can be
              completed later in the Studio.
            - To **compile/run pipelines**, install the MSVC Build Tools
              ("Desktop development with C++"). The package does not bundle MSVC/GCC.
            - Prose compression ships with ONNX Runtime + DirectML; the Kompress model is
              downloaded on demand in Studio and can run on CPU or on a dedicated GPU.

            ## Integrity

            - `*.zip.sha256`, `*-setup.exe.sha256`, `SHA256SUMS`, `SBOM.json` and
              `release-manifest.json` are attached to this release.
            - Tagged releases are Authenticode-signed by SignPath Foundation when signing is
              enabled. See the
              [code signing policy](https://github.com/frankalcantara/Arestrix/blob/main/CODE_SIGNING.md)
              and [privacy policy](https://github.com/frankalcantara/Arestrix/blob/main/PRIVACY.md).
            - No API keys or user data are included.

            This is a rolling pre-release built from the latest `main`; the
            manifest records the exact commit. For a fully validated build, run
            `python scripts/release_check.py` (with E2E) from a clean tree.
          files: |
            release/*.zip
            release/*.zip.sha256
            release/*-setup.exe
            release/*-setup.exe.sha256
            release/SHA256SUMS
            release/SBOM.json
            release/release-manifest.json
            release/release-report.json
