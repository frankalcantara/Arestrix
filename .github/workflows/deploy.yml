name: Deploy portable build

# Builds the real Arestrix binary (native C++ + Studio UI), runs the quality
# gate and publishes a ready-to-run Windows x64 portable package.
#
# - push to main  -> updates the rolling `latest` pre-release
# - tag v*        -> publishes/updates a stable release for that tag
# - manual run    -> same rules, based on the selected branch/tag

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 package + Inno installer
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] deploy runs only on push to main and
        # tags; caches written by pull_request runs are scoped to the PR merge
        # ref and cannot be restored here. See .github/AUTOMATION.md.
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      # ONNX Runtime DirectML + DirectML.dll are not vendored. The packages are
      # pinned by version and SHA-256 in scripts/fetch_onnxruntime.py; the cache
      # keeps the ~36 MB extracted runtime between runs.
      - name: Cache ONNX Runtime + DirectML
        # zizmor: ignore[cache-poisoning] same reasoning as setup-node above:
        # only runs with push access to main can write this key.
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/arestrix-deps/onnxruntime-directml
          key: onnxruntime-directml-ort1.24.4-dml1.15.4

      - name: Fetch ONNX Runtime + DirectML
        shell: bash
        run: |
          python scripts/fetch_onnxruntime.py --output "$RUNNER_TEMP/arestrix-deps/onnxruntime-directml"
          echo "ONNXRUNTIME_ROOT=$RUNNER_TEMP/arestrix-deps/onnxruntime-directml" >> "$GITHUB_ENV"

      # Canonical gate: frontend build, native C++20 build (MSVC, hardening),
      # CTest, Vitest, version/assets/secrets/licenses checks, gateway smoke,
      # then release-manifest + SHA256SUMS + SBOM.
      - name: Run release gate
        run: python scripts/release_check.py --skip-e2e --onnx-dml

      - name: Read product version
        id: product
        shell: bash
        run: |
          version=$(cat version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Stages the portable folder, runs the CLI smoke tests, writes the
      # ZIP + SHA-256 sidecar and compiles the Inno Setup installer from the
      # same staging tree. Requires release/SBOM.json from the gate.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable package and installer
        run: python scripts/package_release.py --installer --require-onnx --require-directml

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          $dir = Join-Path $env:RUNNER_TEMP "ArestrixInstallerSmoke"
          $log = Join-Path $env:RUNNER_TEMP "arestrix-installer-smoke.log"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "installer exited with $($install.ExitCode)"
          }
          $logText = Get-Content $log -Raw
          if ($logText -notmatch 'Preflight report') { throw "preflight report missing from setup log" }
          if ($logText -notmatch '\[OK\] Microsoft Edge WebView2 Runtime') { throw "WebView2 check failed" }
          if ($logText -notmatch '\[OK\] Microsoft Visual C\+\+ Redistributable x64') { throw "VC++ check failed" }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Arestrix.lnk'
          if (-not (Test-Path $desktopShortcut)) { throw "desktop shortcut was not created" }
          & (Join-Path $dir 'arestrix-cli.exe') version
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          foreach ($dll in @('onnxruntime.dll','onnxruntime_providers_shared.dll','DirectML.dll')) {
            if (-not (Test-Path (Join-Path $dir $dll))) { throw "installed ONNX runtime missing $dll" }
          }
          $status = & (Join-Path $dir 'arestrix-cli.exe') compress --status --json | ConvertFrom-Json
          if (-not $status.onnx) { throw "installed CLI was built without ONNX" }
          if (-not $status.dmlBuild) { throw "installed CLI was built without DirectML" }
          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') `
            -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Milliseconds 500
          if (Test-Path $dir) { throw "install directory was not removed" }
          if (Test-Path $desktopShortcut) { throw "desktop shortcut was not removed" }

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Arestrix ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Arestrix latest build (Windows x64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          # `main` keeps the rolling pre-release; a version tag is a stable release.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Ready-to-run **Windows x64** build of Arestrix
            `${{ steps.product.outputs.version }}` (commit `${{ github.sha }}`).

            ## Run the Studio

            **Installer (recommended):** download
            `arestrix-${{ steps.product.outputs.version }}-windows-x64-setup.exe`, run it, and
            open Arestrix from the Start menu. It installs per user in
            `%LOCALAPPDATA%\Programs\Arestrix` and requires no administrator rights.

            **Portable:** download `arestrix-${{ steps.product.outputs.version }}-windows-x64.zip`,
            extract it to any folder (that folder becomes `ARESTRIX_HOME`) and run
            `start-arestrix.bat`.

            The CLI is installed with the Studio:

            ```bat
            arestrix-cli.exe version
            arestrix-cli.exe project validate --project examples\01-svg-agente
            ```

            ## Requirements

            - Windows 10/11 x64.
            - Microsoft Edge WebView2 Runtime and the Visual C++ Redistributable.
              The installer detects both and offers the official download links when missing.
            - The installer also reports (without exposing values) whether Git, a GitHub credential,
              MSVC Build Tools and provider API keys are configured; missing optional items can be
              completed later in the Studio.
            - To **compile/run pipelines**, install the MSVC Build Tools
              ("Desktop development with C++"). The package does not bundle MSVC/GCC.
            - Prose compression ships with ONNX Runtime + DirectML; the Kompress model is
              downloaded on demand in Studio and can run on CPU or on a dedicated GPU.

            ## Integrity

            - `*.zip.sha256`, `*-setup.exe.sha256`, `SHA256SUMS`, `SBOM.json` and
              `release-manifest.json` are attached to this release.
            - The Windows binaries and installer are distributed unsigned; verify the
              published SHA-256 hashes and manifests. See the
              [privacy policy](https://github.com/frankalcantara/Arestrix/blob/main/PRIVACY.md).
            - No API keys or user data are included.

            The manifest records the exact commit. For a fully validated build,
            run `python scripts/release_check.py` (with E2E) from a clean tree.
          files: |
            release/*.zip
            release/*.zip.sha256
            release/*-setup.exe
            release/*-setup.exe.sha256
            release/SHA256SUMS
            release/SBOM.json
            release/release-manifest.json
            release/release-report.json
